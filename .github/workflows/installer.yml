name: installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: powershell -ExecutionPolicy Bypass -File scripts/build_installer.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: eyeLens-installer
          path: dist/eyeLens-*-setup.exe
          if-no-files-found: error

      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/eyeLens-*-setup.exe
          generate_release_notes: true
