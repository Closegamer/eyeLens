[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eyelens"
version = "0.1.0"
description = "A webcam-controlled magnifying lens overlay for Windows desktops"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "eyeLens contributors" }]
keywords = ["eye-tracking", "magnifier", "accessibility", "webcam", "overlay"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: Accessibility",
]
dependencies = [
    "PySide6>=6.7,<7",
    "opencv-contrib-python>=4.10,<5",
    "mediapipe>=0.10.14,<0.11",
    "mss>=9,<11",
    "numpy>=1.26,<3",
    "pynput>=1.7,<2",
    "platformdirs>=4,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
eyelens = "eyelens.app:main"

[project.gui-scripts]
eyelens-gui = "eyelens.app:main"

[tool.setuptools.packages.find]
include = ["eyelens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM"]
ignore = ["E501"]
